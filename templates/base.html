<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SGDI - Sistema de Gestão de Demandas</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

    <style>
        body {
            margin: 0;
        }
    </style>

</head>

<body>

    <!-- CABEÇALHO -->

    <div class="header">

        <h1>SGDI</h1>

        <div class="menu">

            <a href="/">
                Início
            </a>

            <a href="/nova_demanda">
                Nova Demanda
            </a>

            <a href="/gerenciamento">
                Gerenciamento
            </a>

            <a href="/relatorio/solicitantes">
                Relatório
            </a>

            <form
                id="form-busca"
                action="/buscar"
                method="GET"
            >

                <input
                    id="campo-busca"
                    type="search"
                    name="q"
                    value="{{ termo|default('', true) }}"
                    placeholder="Título ou ID"
                    aria-label="Buscar por título ou ID"
                    autocomplete="off"
                >

                <button type="submit">
                    Buscar
                </button>

            </form>

        </div>

    </div>


    <!-- MENSAGENS DO SISTEMA -->

    {% with messages = get_flashed_messages() %}

        {% if messages %}

            {% for message in messages %}

                <div class="alert">
                    {{ message }}
                </div>

            {% endfor %}

        {% endif %}

    {% endwith %}


    <!-- CONTEÚDO DAS PÁGINAS -->

    <div class="container">

        {% block content %}

        {% endblock %}

    </div>


    <!-- RODAPÉ -->

    <div class="footer">

        <p>
            SGDI v1.0 - 2024
        </p>

    </div>

    <script src="{{ url_for('static', filename='busca.js') }}"></script>

</body>

</html>
